<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiz Töle ⚡</title>

<style>
:root { 
--bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); 
--card: rgba(255, 255, 255, 0.98); 
--text: #000000; 
--asyr-blue: #003a8f; 
--main-gold: #ffc107; 
--accent: #00b140; 
--shadow: 0 10px 30px rgba(0,0,0,0.2);
}

body {
font-family:'Segoe UI',sans-serif;
background:var(--bg-gradient);
margin:0;
min-height:100vh;
color:var(--text);
}

.container{
max-width:420px;
margin:auto;
padding:15px;
}

.header-bar{
background:#003a8f;
color:white;
padding:22px;
text-align:center;
font-weight:900;
font-size:28px;
border-radius:0 0 25px 25px;
box-shadow:var(--shadow);
}

.time-box{
display:flex;
justify-content:space-between;
background:#111;
color:#ffc107;
padding:12px 18px;
border-radius:15px;
margin:15px 0;
font-weight:900;
}

.profile-card{
background:var(--card);
padding:25px;
border-radius:25px;
text-align:center;
margin-bottom:20px;
box-shadow:var(--shadow);
}

.menu-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.menu-item{
background:var(--card);
padding:20px 5px;
border-radius:20px;
text-align:center;
box-shadow:var(--shadow);
}

.card{
background:var(--card);
border-radius:25px;
box-shadow:var(--shadow);
}

.card-header{
background:var(--asyr-blue);
color:white;
padding:20px;
text-align:center;
font-weight:900;
font-size:24px;
border-radius:25px 25px 0 0;
}

.card-body{
padding:20px;
}

input,select{
width:100%;
padding:16px;
margin-bottom:12px;
border-radius:12px;
border:2px solid #ddd;
font-size:18px;
}

.pay-btn{
width:100%;
padding:20px;
background:#00b140;
color:white;
border:none;
border-radius:18px;
font-size:22px;
font-weight:900;
cursor:pointer;
}

.pay-btn:hover{
opacity:.9;
}
</style>
</head>

<body>

<div class="header-bar">Tiz Töle ⚡</div>

<div class="container">

<div class="time-box">
<span id="date-now">15.02.2026</span>
<span id="time-now">12:00</span>
</div>

<div class="profile-card">
<h2>Ulanyjy</h2>
</div>

<div class="menu-grid">
<div class="menu-item"><b>Töleg</b></div>
<div class="menu-item"><b>Balans</b></div>
</div>

</div>

</body>
</html>
